<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean · Lektionen</title>
<style>
  html, body { margin:0; height:100%; }
  body { display:flex; flex-direction:column; font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background:#f6f8f4; color:#222; }
  #lessons { display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px; background:#2e8b57; }
  #lessons button { border:none; border-radius:8px; padding:6px 12px; cursor:pointer; background:#ffffff33; color:#fff; text-align:left; font-size:15px; font-weight:600; }
  #lessons button small { display:block; font-size:11px; font-weight:400; opacity:.9; }
  #lessons button.active { background:#fff; color:#2e8b57; }
  iframe { flex:1; width:100%; border:0; }
</style>
</head>
<body>
<nav id="lessons"></nav>
<iframe id="frame" title="Lektion"></iframe>
<script>
// generated by lessons/build.py
const LESSONS = [{"name": "Lektion 1", "dir": "lessons/lektion-1", "note": "TOPIK #7 · Nr. 155–164"}, {"name": "Lektion 2", "dir": "lessons/lektion-2", "note": "TOPIK #7 · Nr. 165–175"}, {"name": "Lektion 3", "dir": "lessons/lektion-3", "note": "TOPIK #8 · Nr. 185–195"}, {"name": "Lektion 4", "dir": "lessons/lektion-4", "note": "TOPIK #8 · Nr. 177–200"}, {"name": "Lektion 5", "dir": "lessons/lektion-5", "note": "TOPIK #9 · Nr. 207–217"}];
const nav = document.getElementById("lessons"), frame = document.getElementById("frame");
function show(i) {
  frame.src = LESSONS[i].dir + "/index.html";
  [...nav.children].forEach((b, j) => b.classList.toggle("active", j === i));
  location.hash = i + 1;
}
LESSONS.forEach((l, i) => {
  const b = document.createElement("button");
  b.innerHTML = `${l.name}<small>${l.note}</small>`;
  b.onclick = () => show(i);
  nav.appendChild(b);
});
const start = parseInt(location.hash.slice(1)) - 1;
show(start >= 0 && start < LESSONS.length ? start : LESSONS.length - 1);
</script>
</body>
</html>
