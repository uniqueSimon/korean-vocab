<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean · Lektion 3</title>
<style>
  :root { --bg:#f6f8f4; --card:#fff; --ink:#222; --muted:#777; --accent:#2e8b57; --ok:#1e9e5a; --bad:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid #dde5d8; padding:10px 16px; }
  header h1 { font-size:18px; margin:0 0 8px; }
  nav { display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  nav button { flex:none; white-space:nowrap; border:1px solid #ccc; background:#fff; border-radius:18px; padding:6px 12px; cursor:pointer; font-size:14px; }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  header { display:flex; flex-wrap:wrap; align-items:flex-start; gap:4px 12px; }
  header h1 { flex:1 1 100%; }
  header nav { flex:1 1 auto; min-width:0; }
  .zoom { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
  .spd { display:flex; align-items:center; gap:4px; margin-left:8px; white-space:nowrap; } .spd input { width:90px; } #sv { min-width:70px; }
  .zoom button { border:1px solid #ccc; background:#fff; border-radius:8px; padding:5px 10px; cursor:pointer; font-size:14px; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .muted { color:var(--muted); font-size:13px; }
  .btn { border:none; background:var(--accent); color:#fff; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:15px; }
  .play { border:none; background:#e3f1e7; border-radius:50%; width:34px; height:34px; cursor:pointer; flex:none; }
  .words { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; }
  .word { text-align:center; }
  .word img { width:100%; max-height:150px; object-fit:contain; border-radius:8px; background:#f3f7ef; }
  .word .k { font-size:30px; font-weight:600; margin-top:6px; }
  .word .yo { color:var(--accent); }
  .word .de { font-size:17px; }
  .word .ex { margin-top:8px; padding-top:8px; border-top:1px dashed #e0e0e0; font-size:18px; text-align:left; display:flex; gap:8px; align-items:flex-start; }
  .word .note { font-size:12px; color:var(--muted); margin-top:6px; text-align:left; }
  .reveal { cursor:pointer; filter:blur(8px); user-select:none; } .reveal.open { filter:none; }
  .word span.reveal { display:inline-block; }
  .story { display:flex; gap:10px; align-items:flex-start; padding:10px 8px; border-bottom:1px dashed #e0e0e0; border-radius:8px; }
  .story > .muted { width:20px; padding-top:8px; text-align:right; }
  .story .ko { font-size:22px; } .story.now { background:#eef8f0; }
  .hidden-t { filter:blur(6px); cursor:pointer; } .hidden-t.open { filter:none; }
  .bubble { display:flex; gap:8px; align-items:flex-start; margin:10px 0; }
  .bubble.B { flex-direction:row-reverse; text-align:right; }
  .bubble .t { background:#eef8f0; border-radius:12px; padding:8px 12px; max-width:80%; }
  .bubble.B .t { background:#eef2fb; }
  .bubble .ko { font-size:21px; }
  input[type=text] { font-size:20px; padding:8px; width:100%; border:1px solid #ccc; border-radius:8px; }
  .big { font-size:28px; text-align:center; margin:10px 0; }
  table { width:100%; border-collapse:collapse; } td, th { padding:6px; border-bottom:1px solid #eee; text-align:left; }
  .pair { display:flex; gap:10px; } .pair > div { flex:1; text-align:center; background:#f3f7ef; border-radius:10px; padding:10px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
</style>
</head>
<body>
<header>
  <h1><span class="muted">Lektion 3 ·</span> 🙋 질문과 대답 — Fragen &amp; Antworten <span class="muted">(TOPIK #8: 질문 · 묻다 · 대답하다 · 답 · 맞다 · 틀리다 · 이름 · 적다 · 말 · 외국어)</span></h1>
  <nav id="nav"></nav>
  <div class="zoom"><button id="zm" aria-label="Verkleinern">A−</button><span id="zv"></span><button id="zp" aria-label="Vergrößern">A+</button>
    <label class="spd">🐢 Tempo <input type="range" id="spd" min="0" max="3" step="1"> <span id="sv"></span></label></div>
</header>
<main id="main"></main>
<script>
(function(){
  var z=parseFloat(localStorage.getItem('pageZoom'))||1, m=document.getElementById('main'), v=document.getElementById('zv');
  function set(x){ z=Math.min(2,Math.max(0.8,Math.round(x*10)/10)); m.style.zoom=z; v.textContent=Math.round(z*100)+'%'; localStorage.setItem('pageZoom',z); }
  document.getElementById('zm').onclick=function(){set(z-0.1)};
  document.getElementById('zp').onclick=function(){set(z+0.1)};
  set(z);
  var S=[["s10","schnell"],["s25","normal"],["s40","langsam"],["s50","sehr langsam"]], r=document.getElementById('spd'), sv=document.getElementById('sv');
  var si=localStorage.getItem('audioSpeed'); si=si===null?2:+si;
  function setS(i){ r.value=i; window.audioDir=S[i][0]; sv.textContent=S[i][1]; localStorage.setItem('audioSpeed',i); }
  r.oninput=function(){setS(+r.value)};
  setS(si);
})();
</script>
<footer>Pictures: <a href="https://openmoji.org">OpenMoji</a> (CC BY-SA 4.0) · Audio: Edge TTS · Anki deck: anki/topik-8-asking-answering.apkg</footer>
<script>
const DATA = {"words": [{"word": "질문", "pron": "질문", "pos": "n.", "de": "Frage", "en": "question", "yo": null, "note": "질문이 있어요 = „es gibt eine Frage“ (이/가).", "img": "img/topik8-2753.png", "audio": "8e872f606d3c.mp3", "yoAudio": null, "ex": {"ko": "질문이 있어요.", "de": "Ich habe eine Frage.", "en": "I have a question.", "audio": "51a980d5e52a.mp3"}}, {"word": "묻다", "pron": "묻따", "pos": "v.", "de": "fragen", "en": "to ask", "yo": "물어요", "note": "ㄷ-unregelmäßig: 묻 → 물어요, 물었어요 (wie 듣다 → 들어요).", "img": "img/topik8-1f64b-2753.png", "audio": "ffd135940f18.mp3", "yoAudio": "cac8a5456d33.mp3", "ex": {"ko": "이름을 물어요.", "de": "Ich frage nach dem Namen.", "en": "I ask (for) the name.", "audio": "30f2f695b164.mp3"}}, {"word": "대답하다", "pron": "대다파다", "pos": "v.", "de": "antworten", "en": "to answer", "yo": "대답해요", "note": "대답 + 하다. Auf eine Frage = 질문에 (에).", "img": "img/topik8-1f642-1f4ac.png", "audio": "5ec9a81c617a.mp3", "yoAudio": "a2cabe4f7ece.mp3", "ex": {"ko": "질문에 대답해요.", "de": "Ich antworte auf die Frage.", "en": "I answer the question.", "audio": "5e2b41abbdd7.mp3"}}, {"word": "답", "pron": "답", "pos": "n.", "de": "Antwort, Lösung", "en": "answer", "yo": null, "note": "Kurzform von 대답. Auch: Lösung einer Aufgabe.", "img": "img/topik8-1f4a1.png", "audio": "50afb5219689.mp3", "yoAudio": null, "ex": {"ko": "답이 맞아요.", "de": "Die Antwort ist richtig.", "en": "The answer is correct.", "audio": "aa31ca313df3.mp3"}}, {"word": "맞다", "pron": "맏따", "pos": "adj.", "de": "richtig sein, stimmen", "en": "to be correct", "yo": "맞아요", "note": "Gegenteil: 틀리다. Mit 이/가: 답이 맞아요.", "img": "img/topik8-2b55.png", "audio": "a80123a2ec40.mp3", "yoAudio": "ffa8bd765425.mp3", "ex": {"ko": "그 답이 맞아요.", "de": "Diese Antwort ist richtig.", "en": "That answer is correct.", "audio": "154d25983344.mp3"}}, {"word": "틀리다", "pron": "틀리다", "pos": "adj.", "de": "falsch sein", "en": "to be wrong", "yo": "틀려요", "note": "NICHT 다르다 (= anders sein)!", "img": "img/topik8-274c.png", "audio": "c778f61bcdcf.mp3", "yoAudio": "dc7a75c10b4a.mp3", "ex": {"ko": "답이 틀려요.", "de": "Die Antwort ist falsch.", "en": "The answer is wrong.", "audio": "2af0a7f52034.mp3"}}, {"word": "이름", "pron": "이름", "pos": "n.", "de": "Name", "en": "name", "yo": null, "note": "이름 + 이/가 뭐예요?", "img": "img/topik8-1f4db.png", "audio": "1c87a11b8a0d.mp3", "yoAudio": null, "ex": {"ko": "이름이 뭐예요?", "de": "Wie heißt du? (Was ist dein Name?)", "en": "What is your name?", "audio": "1207b81a179c.mp3"}}, {"word": "적다", "pron": "적따", "pos": "v.", "de": "aufschreiben, notieren", "en": "to write down", "yo": "적어요", "note": "Achtung: 적다 = „wenig sein“ (적은 월급) — klingt gleich, Kontext entscheidet.", "img": "img/topik8-270d-1f4dd.png", "audio": "5071a60ce52d.mp3", "yoAudio": "bb65c62a2caa.mp3", "ex": {"ko": "이름을 적어요.", "de": "Ich schreibe den Namen auf.", "en": "I write down the name.", "audio": "d470a41d7663.mp3"}}, {"word": "말", "pron": "말", "pos": "n.", "de": "Wort, Sprache, Gesagtes", "en": "speech, language, words", "yo": null, "note": "말을 하다 = sprechen; 한국어로 말해요 = auf Koreanisch sprechen.", "img": "img/topik8-1f5e3.png", "audio": "41c62d10ac80.mp3", "yoAudio": null, "ex": {"ko": "말을 해요.", "de": "Ich spreche.", "en": "I speak.", "audio": "39251d662e9a.mp3"}}, {"word": "외국어", "pron": "외구거", "pos": "n.", "de": "Fremdsprache", "en": "foreign language", "yo": null, "note": "외국 (Ausland) + 어 (Sprache).", "img": "img/topik8-1f30d-1f5e3.png", "audio": "67e900dcbecc.mp3", "yoAudio": null, "ex": {"ko": "외국어를 공부해요.", "de": "Ich lerne eine Fremdsprache.", "en": "I study a foreign language.", "audio": "ce1f4ee76c9f.mp3"}}], "pairs": [["맞다 ⭕", "틀리다 ❌"], ["질문 ❓", "답 💡"], ["묻다 🙋", "대답하다 💬"]], "grammar": [["묻다 → 물어요", "ㄷ-unregelmäßig: ㄷ wird vor Vokal zu ㄹ (듣다 → 들어요). 물었어요 = ich fragte."], ["N에 대답해요", "antworten <i>auf</i> etwas: 질문에 대답해요."], ["답이 맞아요 / 틀려요", "맞다 und 틀리다 sind Adjektive → Subjekt mit 이/가."], ["N로 말해요", "in einer Sprache sprechen: 한국어로 말해요."], ["이름이 뭐예요?", "Wie heißt du? / Wie ist der Name?"], ["적다 (2×)", "aufschreiben (이름을 적어요) <i>oder</i> wenig sein (월급이 적어요)."]], "dialogueTitle": ["한국어 수업", "Koreanisch-Unterricht"], "dialogue": [{"spk": "A", "ko": "질문이 있어요?", "de": "Hast du eine Frage?", "en": "Do you have a question?", "audio": "d6baca8e05e5.mp3"}, {"spk": "B", "ko": "네, 있어요. 이 답이 맞아요?", "de": "Ja. Ist diese Antwort richtig?", "en": "Yes. Is this answer correct?", "audio": "1c5b5d6b91ce.mp3"}, {"spk": "A", "ko": "아니요, 틀려요.", "de": "Nein, sie ist falsch.", "en": "No, it's wrong.", "audio": "72ffdd95fcd7.mp3"}, {"spk": "B", "ko": "그럼 이 답이 맞아요?", "de": "Dann ist diese Antwort richtig?", "en": "Then is this answer correct?", "audio": "ebe4fdfad59b.mp3"}, {"spk": "A", "ko": "네, 맞아요! 이름을 적어요.", "de": "Ja, richtig! Schreib den Namen auf.", "en": "Yes, correct! Write down your name.", "audio": "c681e03a9905.mp3"}, {"spk": "B", "ko": "네. 저는 외국어를 공부해요.", "de": "Ja. Ich lerne eine Fremdsprache.", "en": "Okay. I study a foreign language.", "audio": "98e5c2e621d7.mp3"}, {"spk": "A", "ko": "한국어로 말해요!", "de": "Sprich auf Koreanisch!", "en": "Speak in Korean!", "audio": "eff40bd5b345.mp3"}], "storyTitle": ["한국어 수업", "Der Koreanischunterricht"], "story": [{"ko": "오늘 한국어 수업이 있어요.", "de": "Heute habe ich Koreanischunterricht.", "audio": "3ee497beac72.mp3"}, {"ko": "한국어는 외국어예요.", "de": "Koreanisch ist eine Fremdsprache.", "audio": "1aacbb1b0228.mp3"}, {"ko": "저는 의자에 앉아요.", "de": "Ich setze mich auf den Stuhl.", "audio": "b4b430df0c71.mp3"}, {"ko": "선생님이 한국어로 말해요.", "de": "Die Lehrerin spricht Koreanisch.", "audio": "442a27044c45.mp3"}, {"ko": "저는 선생님의 말을 들어요.", "de": "Ich höre der Lehrerin zu.", "audio": "d8fb0039a28a.mp3"}, {"ko": "선생님이 제 이름을 물어요.", "de": "Die Lehrerin fragt nach meinem Namen.", "audio": "f375dffc6b3d.mp3"}, {"ko": "저는 한국어로 대답해요.", "de": "Ich antworte auf Koreanisch.", "audio": "c94a8eb289cf.mp3"}, {"ko": "선생님이 질문을 해요.", "de": "Die Lehrerin stellt eine Frage.", "audio": "f478d32825a1.mp3"}, {"ko": "저는 수첩에 답을 적어요.", "de": "Ich schreibe die Antwort in mein Notizbuch.", "audio": "ca26a88b63fa.mp3"}, {"ko": "이 답은 맞아요.", "de": "Diese Antwort ist richtig.", "audio": "b16f5c49b543.mp3"}, {"ko": "그런데 저 답은 틀려요.", "de": "Aber jene Antwort ist falsch.", "audio": "fb8538815064.mp3"}, {"ko": "수업이 일찍 끝나요.", "de": "Der Unterricht endet früh.", "audio": "bb7112115586.mp3"}], "dictation": [{"ko": "질문에 대답해요.", "audio": "5e2b41abbdd7.mp3"}, {"ko": "답이 틀려요.", "audio": "2af0a7f52034.mp3"}, {"ko": "이름을 적어요.", "audio": "d470a41d7663.mp3"}, {"ko": "이름을 물어요.", "audio": "30f2f695b164.mp3"}, {"ko": "외국어를 공부해요.", "audio": "ce1f4ee76c9f.mp3"}]};
const $ = (s, r=document) => r.querySelector(s);
let cur = null;
let runId = 0;
const src = f => "audio/" + window.audioDir + "/" + f;
function play(file) { runId++; if (cur) cur.pause(); cur = new Audio(src(file)); cur.play(); }
function stopAudio() { runId++; if (cur) cur.pause(); document.querySelectorAll(".story.now").forEach(e => e.classList.remove("now")); }
const btn = f => `<button class="play" onclick="play('${f}')">🔊</button>`;
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);

const TABS = {
  "Wörter": () => `<p class="muted">Rate das Wort zum Bild, dann tippe auf den unscharfen Bereich. Tippe 🔊 zum Anhören.
      <button class="btn" onclick="document.querySelectorAll('.reveal').forEach(e=>e.classList.toggle('open', this.dataset.s!=='1')); this.dataset.s=this.dataset.s==='1'?'':'1'">Alle zeigen/verbergen</button></p><div class="words">` +
    DATA.words.map(w => `<div class="card word" onclick="if(!event.target.closest('button'))this.querySelectorAll('.reveal').forEach(e=>e.classList.toggle('open'))">
      <img src="${w.img}" alt="">
      <div class="de">${w.de}</div>
      <div class="k"><span class="reveal">${w.word}</span> ${btn(w.audio)}</div>
      <div class="muted reveal">[${w.pron}] · ${w.pos}</div>
      ${w.yo ? `<div class="yo"><span class="reveal">${w.yo}</span> ${btn(w.yoAudio)}</div>` : ""}
      <div class="ex">${btn(w.ex.audio)}<div><span class="reveal">${w.ex.ko}</span><br><span class="muted">${w.ex.de}</span></div></div>
      <div class="note reveal">${w.note}</div></div>`).join("") + `</div>`,

  "Zusammenhang": () => `<div class="card"><h3>Gegensatzpaare</h3>` +
      DATA.pairs.map(p => `<div class="pair"><div class="big">${p[0]}</div><div class="big">${p[1]}</div></div>`).join("") + `</div>
    <div class="card"><h3>Grammatik-Notizen</h3><table>` +
      DATA.grammar.map(g => `<tr><td><b>${g[0]}</b></td><td>${g[1]}</td></tr>`).join("") + `</table></div>`,

  "Dialog": () => `<div class="card"><h3>${DATA.dialogueTitle[0]} <span class="muted">${DATA.dialogueTitle[1]}</span></h3>` +
    DATA.dialogue.map(d => `<div class="bubble ${d.spk}">${btn(d.audio)}<div class="t"><div class="ko reveal" onclick="this.classList.toggle('open')">${d.ko}</div>
      <div class="muted hidden-t" onclick="this.classList.toggle('open')">${d.de}</div></div></div>`).join("") +
    `<button class="btn" onclick="playAll()">▶ Alles abspielen</button> <button class="btn" onclick="document.querySelectorAll('.bubble .reveal, .bubble .hidden-t').forEach(e=>e.classList.toggle('open', this.dataset.s!=='1')); this.dataset.s=this.dataset.s==='1'?'':'1'">Alle zeigen/verbergen</button></div>`,

  "Geschichte": () => `<div class="card"><h3>${DATA.storyTitle[0]} <span class="muted">${DATA.storyTitle[1]}</span></h3>
      <p class="muted">Höre Satz für Satz. Tippe auf den unscharfen Satz, um ihn zu sehen – die Übersetzung darunter separat.</p>
      <p><button class="btn" onclick="playStory()">▶ Ganze Geschichte</button> <button class="btn" onclick="stopAudio()">⏹ Stop</button>
      <button class="btn" onclick="document.querySelectorAll('.story .reveal').forEach(e=>e.classList.toggle('open', this.dataset.s!=='1')); this.dataset.s=this.dataset.s==='1'?'':'1'">Alle zeigen/verbergen</button></p>` +
    DATA.story.map((s, i) => `<div class="story" id="st${i}"><span class="muted">${i + 1}</span>${btn(s.audio)}<div>
      <div class="reveal ko" onclick="this.classList.toggle('open')">${s.ko}</div>
      <div class="reveal muted" onclick="this.classList.toggle('open')">${s.de}</div></div></div>`).join("") + `</div>`,

  "Diktat": () => `<div id="dict"></div>`,
};

function dictation() {
  const el = $("#dict"); let i = 0;
  const show = () => {
    if (i >= DATA.dictation.length) { el.innerHTML = `<div class="card"><div class="big">🎉</div><button class="btn" onclick="dictation()">Nochmal</button></div>`; i = 0; return; }
    const d = DATA.dictation[i];
    el.innerHTML = `<div class="card"><div class="muted">${i + 1} / ${DATA.dictation.length} · Höre und schreibe</div>
      <div class="big">${btn(d.audio)}</div><input type="text" id="inp" autocomplete="off" placeholder="한국어…">
      <p id="res" class="muted"></p><div id="act"><button class="btn" id="chk">Prüfen</button></div></div>`;
    play(d.audio);
    const norm = s => s.replace(/[\s.?!]/g, "");
    const check = () => {
      const ok = norm($("#inp").value) === norm(d.ko);
      if (ok) { $("#res").innerHTML = "✅ Richtig!"; setTimeout(() => { i++; show(); }, 800); return; }
      $("#res").innerHTML = `❌ Nicht ganz. Richtig: <b>${d.ko}</b>`;
      $("#act").innerHTML = `<button class="btn" id="retry">↻ Nochmal versuchen</button> <button class="btn" id="next">Weiter →</button>`;
      $("#retry").onclick = () => { $("#res").innerHTML = ""; $("#act").innerHTML = `<button class="btn" id="chk">Prüfen</button>`; $("#chk").onclick = check; $("#inp").value = ""; $("#inp").focus(); play(d.audio); };
      $("#next").onclick = () => { i++; show(); };
    };
    $("#chk").onclick = check;
    $("#inp").onkeydown = e => { if (e.key === "Enter" && $("#chk")) check(); };
  };
  show();
}

function playStory() {
  stopAudio(); const id = runId; let i = 0;
  const next = () => {
    document.querySelectorAll(".story.now").forEach(e => e.classList.remove("now"));
    if (id !== runId || i >= DATA.story.length) return;
    const el = document.getElementById("st" + i); el.classList.add("now"); el.scrollIntoView({ block: "center", behavior: "smooth" });
    cur = new Audio(src(DATA.story[i++].audio));
    cur.onended = () => setTimeout(() => { if (id === runId) next(); }, 2500);
    cur.play();
  };
  next();
}

function playAll() {
  let i = 0;
  const next = () => { if (i >= DATA.dialogue.length) return; cur = new Audio(src(DATA.dialogue[i++].audio)); cur.onended = () => setTimeout(next, 1800); cur.play(); };
  next();
}

function tab(name) {
  document.querySelectorAll("#nav button").forEach(b => {
    b.classList.toggle("active", b.textContent === name);
    if (b.textContent === name) b.scrollIntoView({ block: "nearest", inline: "nearest" });
  });
  $("#main").innerHTML = TABS[name]();
  if (name === "Diktat") dictation();
}
$("#nav").innerHTML = Object.keys(TABS).map(n => `<button onclick="tab('${n}')">${n}</button>`).join("");
tab("Wörter");
</script>
</body>
</html>
